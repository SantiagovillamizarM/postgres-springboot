# Configuración de Conexión a PostgreSQL (Docker)
spring.datasource.url=jdbc:postgresql://localhost:5433/bkddb
spring.datasource.username=bkseducate
spring.datasource.password=bkseducate2026
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Configuración de Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Seguridad (JWT)
# JWT_SECRET es obligatoria (mínimo 32 caracteres); sin ella la aplicación no arranca
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=15m
jwt.refresh-token-expiration=7d

# Primer ADMIN: se crea al arrancar solo si se definen estas variables y aún no existe ninguno
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Orígenes del frontend que pueden llamar a la API (separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
