# Configuración de Conexión a PostgreSQL (Docker)
spring.datasource.url=jdbc:postgresql://localhost:5433/bkddb
spring.datasource.username=bkseducate
spring.datasource.password=bkseducate2026
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Configuración de Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
